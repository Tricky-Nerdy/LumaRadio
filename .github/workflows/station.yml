name: Silent station checks
on:
  pull_request:
    paths:
      - station/**
      - telemetry/**
      - tests/test_station*.py
      - .github/workflows/station.yml
  push:
    branches: [feature/forge-solar-station-20261020]
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r telemetry/requirements.txt
      - run: python -m unittest discover -s tests -v
