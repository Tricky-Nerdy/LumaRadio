name: Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - run: godot --headless --path . --editor --quit
      - run: godot --headless --path . --export-release Windows LumaRadio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LumaRadio-Windows-EXE
          path: |
            LumaRadio.exe
            LumaRadio.pck
